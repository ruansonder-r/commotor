{% extends "layouts/application.html" %}
{% block title %}{{ heading }} &mdash; Admin{% endblock %}
{% block content %}
{% include "admin/_nav.html" %}
<div class="admin-header"><h2 class="admin-header__title">{{ heading }}</h2></div>
<div class="form-card">
  <form method="post" action="{{ action }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    {% include "admin/_errors.html" %}
    <div class="form-group">
      <label for="membership_user">User</label>
      <select id="membership_user" name="user_id">
        <option value="">Select a user</option>
        {% for user in users %}
          <option value="{{ user.id }}" {% if values.user_id and values.user_id|string == user.id|string %}selected{% endif %}>{{ user.display_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="membership_group">Group</label>
      <select id="membership_group" name="carpool_group_id">
        <option value="">Select a group</option>
        {% for group in groups %}
          <option value="{{ group.id }}" {% if values.carpool_group_id and values.carpool_group_id|string == group.id|string %}selected{% endif %}>{{ group.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="membership_split">Cost split (0.0&ndash;1.0, e.g. 0.5 = 50%)</label>
      <input type="number" step="0.01" min="0.01" max="1.0" id="membership_split"
             name="cost_split_percentage"
             value="{{ values.cost_split_percentage|trim if values.cost_split_percentage else '' }}"
             placeholder="0.5">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn--primary">Save</button>
      <a href="/admin/memberships" class="btn btn--ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
