{% extends "layouts/application.html" %}
{% block title %}New Group &mdash; Commoter{% endblock %}

{% block content %}
<div class="admin-header"><h2 class="admin-header__title">Add a carpool group</h2></div>
<div class="form-card">
  <form method="post" action="/carpool_groups">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    {% include "_errors.html" %}
    {% if my_groups %}
      <div class="form-group">
        <label for="group_copy_from">Roll forward</label>
        <select id="group_copy_from" name="copy_from">
          <option value="">&mdash; Start blank &mdash;</option>
          {% for option in my_groups %}
            <option value="{{ option.id }}" {% if values.copy_from and values.copy_from|string == option.id|string %}selected{% endif %}>{{ option.name }} &mdash; {{ option.month|month_label }}</option>
          {% endfor %}
        </select>
        <p class="form-hint">Copies that month's members and their splits into the new one.</p>
      </div>
    {% endif %}
    <div class="form-group">
      <label for="group_name">Name</label>
      <input type="text" id="group_name" name="name" value="{{ values.name or '' }}" placeholder="e.g. Morning Crew">
    </div>
    <div class="form-group">
      <label for="group_month">Month</label>
      <input type="month" id="group_month" name="month" value="{{ values.month or '' }}">
    </div>
    <div class="form-group">
      <label for="group_car">Car</label>
      <select id="group_car" name="car_id">
        <option value="">Select a car</option>
        {% for car in cars %}
          <option value="{{ car.id }}" {% if values.car_id and values.car_id|string == car.id|string %}selected{% endif %}>{{ car.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="group_trip">Trip</label>
      <select id="group_trip" name="trip_id">
        <option value="">Select a trip</option>
        {% for trip in trips %}
          <option value="{{ trip.id }}" {% if values.trip_id and values.trip_id|string == trip.id|string %}selected{% endif %}>{{ trip.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn--primary">Save</button>
      <a href="/" class="btn btn--ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
