[project]
name = "commoter"
version = "1.0.0"
description = "Carpool trip tracking and cost splitting."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:starlette.testclient",
  "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a default is the FastAPI dependency-injection idiom, not the
# mutable-default bug B008 is looking for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; leave the generated formatting alone.
"migrations/versions/*.py" = ["E501"]
